<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Original example puppet rig with joints and coordinate labels">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#18203a"/><stop offset="1" stop-color="#2d263b"/></linearGradient><linearGradient id="coat" x2="1" y2="1"><stop stop-color="#f9d384"/><stop offset="1" stop-color="#cc8c3c"/></linearGradient><radialGradient id="head"><stop stop-color="#353443"/><stop offset=".75" stop-color="#171924"/><stop offset="1" stop-color="#090e18"/></radialGradient></defs>
<rect width="1600" height="900" fill="url(#bg)"/><circle cx="440" cy="475" r="310" fill="#efa857" opacity=".06"/>
<text x="80" y="95" fill="#f7f0dd" font-family="DejaVu Sans, sans-serif" font-size="47" font-weight="bold">CHARACTER / RIG STUDY</text><text x="82" y="137" fill="#bec9d2" font-family="DejaVu Sans, sans-serif" font-size="22">Original example · front view · pivots shown in teal</text>
<rect x="74" y="178" width="685" height="620" rx="28" fill="#111b2b" fill-opacity=".5" stroke="#8da6ae" stroke-opacity=".28"/>
<line x1="150" y1="716" x2="675" y2="716" stroke="#a9b7ba" stroke-opacity=".35" stroke-width="2"/>
<g transform="translate(425 716)">
<!-- far legs --> <path d="M-15 -190 L-22 -101 L-29 -11 M15 -190 L22 -101 L29 -11" fill="none" stroke="#0a101a" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
<ellipse cx="-35" cy="-7" rx="22" ry="10" fill="#11131d"/><ellipse cx="35" cy="-7" rx="22" ry="10" fill="#11131d"/>
<!-- arm bones --> <path d="M-29 -300 L-57 -236 L-58 -185 M29 -300 L57 -236 L58 -185" fill="none" stroke="#12151e" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-58" cy="-185" r="11" fill="#10131c"/><circle cx="58" cy="-185" r="11" fill="#10131c"/>
<!-- torso --> <rect x="-32" y="-324" width="64" height="134" rx="18" fill="url(#coat)"/><path d="M0 -322 V-194" stroke="#fae3ae" stroke-opacity=".55" stroke-width="3"/><path d="M-18 -289 h9 M-18 -273 h9" stroke="#9b6b36" stroke-width="2"/>
<!-- face --> <circle cx="0" cy="-369" r="42" fill="url(#head)" stroke="#eec278" stroke-width="2"/><ellipse cx="-13" cy="-372" rx="7" ry="9" fill="#fff7e7"/><ellipse cx="13" cy="-372" rx="7" ry="9" fill="#fff7e7"/><path d="M-20 -388 l12 -3 M8 -391 l12 3 M-6 -352 q6 3 12 0" fill="none" stroke="#fff5df" stroke-width="3" stroke-linecap="round"/>
<!-- pivots --> <g fill="#6ee1d0" stroke="#163842" stroke-width="2"><circle cx="0" cy="-327" r="6"/><circle cx="-29" cy="-300" r="6"/><circle cx="29" cy="-300" r="6"/><circle cx="-57" cy="-236" r="6"/><circle cx="57" cy="-236" r="6"/><circle cx="-58" cy="-185" r="6"/><circle cx="58" cy="-185" r="6"/><circle cx="-15" cy="-190" r="6"/><circle cx="15" cy="-190" r="6"/><circle cx="-22" cy="-101" r="6"/><circle cx="22" cy="-101" r="6"/><circle cx="-29" cy="-11" r="6"/><circle cx="29" cy="-11" r="6"/></g>
</g>
<g fill="#d4e6df" font-family="DejaVu Sans, sans-serif" font-size="20"><text x="134" y="335">HEAD + FACE</text><text x="142" y="424">SHOULDER</text><text x="140" y="480">ELBOW</text><text x="156" y="533">WRIST</text><text x="535" y="533">HIP / PELVIS</text><text x="552" y="620">KNEE</text><text x="548" y="708">ANKLE</text></g>
<g stroke="#8bd2c4" stroke-width="2" opacity=".8"><path d="M320 330 L385 348 M290 419 L390 416 M250 477 L363 480 M240 529 L362 531 M529 528 L442 526 M541 616 L451 615 M533 702 L457 705"/></g>
<text x="805" y="245" fill="#f9f3e3" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="bold">HIERARCHY</text><g fill="#cbd7db" font-family="DejaVu Sans Mono, monospace" font-size="22"><text x="805" y="300">root → pelvis → torso → neck</text><text x="805" y="339">                         → head → face</text><text x="805" y="390">shoulder → elbow → wrist → hand</text><text x="805" y="439">hip      → knee  → ankle → foot</text></g>
<rect x="805" y="515" width="666" height="190" rx="18" fill="#233547" stroke="#526a73"/><g fill="#e5eadf" font-family="DejaVu Sans, sans-serif" font-size="21"><text x="835" y="561">• Parent facial features to the head.</text><text x="835" y="603">• Keep both feet grounded during holds.</text><text x="835" y="645">• Hide seams with overlapping shapes.</text><text x="835" y="687">• Rotate children around joint pivots.</text></g>
<text x="80" y="850" fill="#9fb0ba" font-family="DejaVu Sans, sans-serif" font-size="19">Illustrative dimensions and joint system; not the source video's recovered rig.</text></svg>