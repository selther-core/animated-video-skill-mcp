</g><rect x="0" y="0" width="1280" height="720" fill="url(#vignette)" pointer-events="none"/></svg><script>
'use strict';
const $=id=>document.getElementById(id), NS='http://www.w3.org/2000/svg', clamp=x=>Math.max(0,Math.min(1,x)), ease=x=>{x=clamp(x);return x*x*(3-2*x)}, mix=(a,b,u)=>a+(b-a)*u;
window.DURATION=16;
// Original, fictional example: no reference footage, source images, or sound.
const shelves=$('shelfBooks'), palette=['#aa795b','#d0a17b','#767f72','#bdac86','#e2c9a1','#85796b'];
for(let row=0;row<3;row++){for(let j=0;j<12;j++){let book=document.createElementNS(NS,'rect');book.setAttribute('x',1076+j*17);book.setAttribute('y',122+row*85+(j%3)*5);book.setAttribute('width',11+(j%2)*2);book.setAttribute('height',47-(j%3)*5);book.setAttribute('fill',palette[(row*4+j)%palette.length]);book.setAttribute('opacity','.8');shelves.appendChild(book)}}
function actor(x,body){let group=document.createElementNS(NS,'g');group.setAttribute('transform',`translate(${x} 592)`);group.innerHTML=`<ellipse cx="0" cy="4" rx="38" ry="7" fill="#141817" opacity=".35"/><g class="backarm"><path d="M17-238 Q28-207 22-177" stroke="#172022" stroke-width="10" stroke-linecap="round" fill="none"/><path d="M16-238q11 15 9 30" stroke="url(#${body})" stroke-width="18" stroke-linecap="round" fill="none"/></g><path d="M-9-131q-3 52-4 122M9-131q3 52 5 122" stroke="#151c1d" stroke-width="8" stroke-linecap="round" fill="none"/><path d="M-21-9h16M6-9h18" stroke="#141b1a" stroke-width="9" stroke-linecap="round"/><rect x="-28" y="-259" width="56" height="139" rx="27" fill="url(#${body})"/><path d="M-17-241v98" stroke="#fff4da" opacity=".22" stroke-width="5" stroke-linecap="round"/><g class="frontarm"><path d="M-18-238Q-4-215-8-174" stroke="#151c1d" stroke-width="9" stroke-linecap="round" fill="none"/><path d="M-18-238q8 12 9 27" stroke="url(#${body})" stroke-width="18" stroke-linecap="round" fill="none"/><circle cx="-8" cy="-174" r="6" fill="#151c1d"/></g><g class="head"><circle cx="0" cy="-293" r="34" fill="url(#skin)"/><ellipse cx="-11" cy="-306" rx="13" ry="6" fill="#e4eee9" opacity=".12"/><g class="eyes"><ellipse cx="-11" cy="-294" rx="6" ry="7" fill="#fffdf0"/><ellipse cx="11" cy="-294" rx="6" ry="7" fill="#fffdf0"/><circle cx="-9" cy="-293" r="2.5" fill="#161d1c"/><circle cx="13" cy="-293" r="2.5" fill="#161d1c"/></g><path class="mouth" d="M-5-277q5 3 10 0" fill="none" stroke="#eae9d8" stroke-width="2" stroke-linecap="round"/></g>`;$('actors').appendChild(group);return group}
const left=actor(205,'coat'),right=actor(1056,'mustard');
function pose(g,t,gesture,phase){let arm=g.querySelector('.frontarm'),head=g.querySelector('.head'),eyes=g.querySelector('.eyes');arm.setAttribute('transform',`rotate(${gesture} -18 -238)`);head.setAttribute('transform',`rotate(${Math.sin(t*.7+phase)*.7} 0 -293)`);let cycle=(t+phase)%5,blink=cycle>4.92?.14:1;eyes.setAttribute('transform',`translate(0 ${-294*(1-blink)}) scale(1 ${blink})`)}
function seek(t){t=Math.max(0,Math.min(window.DURATION-.001,t));let add=ease((t-4)/.9), travel=ease((t-5.2)/2.8), zoom=ease((t-9.5)/3.5), z=1+.10*zoom,cx=mix(640,670,zoom);$('camera').setAttribute('transform',`translate(640 360) scale(${z}) translate(${-cx} -360)`);$('stageTwo').setAttribute('opacity',add);$('route').setAttribute('stroke-dashoffset',1-ease((t-5.1)/2.7));$('parcelB').setAttribute('opacity',ease((t-5.1)/.5));$('parcelB').setAttribute('transform',`translate(${mix(390,738,travel)} ${238-33*Math.sin(Math.PI*travel)}) rotate(${5*Math.sin(Math.PI*travel)})`);$('note').setAttribute('opacity',ease((t-8)/.8));$('dust').setAttribute('transform',`translate(${2*Math.sin(t*.3)} ${-3*Math.sin(t*.2)})`);let point=72*ease((t-4.2)/1.1)*(1-ease((t-8.8)/1.5));pose(right,t,point,1);pose(left,t,2*Math.sin(t*.5),3);}
window.seek=seek;let params=new URLSearchParams(location.search);if(params.has('t'))seek(Number(params.get('t'))||0);else{let begin=performance.now();function loop(now){seek(((now-begin)/1000)%window.DURATION);requestAnimationFrame(loop)}requestAnimationFrame(loop)}
</script></body></html>
