<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Seekable staging and character demo</title><style>html,body{margin:0;background:#111c20;height:100%;display:grid;place-items:center}svg{width:min(100vw,177.78vh);height:auto;display:block}</style></head><body><svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Original mountain journey and journal cutaway"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#344c59"/><stop offset="1" stop-color="#d6c59b"/></linearGradient><radialGradient id="warmPool"><stop stop-color="#ffdc8b" stop-opacity=".9"/><stop offset="1" stop-color="#ffdc8b" stop-opacity="0"/></radialGradient><radialGradient id="head"><stop stop-color="#414b49"/><stop offset="1" stop-color="#101616"/></radialGradient><linearGradient id="uniform" x2="0" y2="1"><stop stop-color="#b5b582"/><stop offset="1" stop-color="#6c795f"/></linearGradient><linearGradient id="paper" x2="0" y2="1"><stop stop-color="#f9eccd"/><stop offset="1" stop-color="#c8b790"/></linearGradient></defs>

<g class="scene" id="detail" style="display:none"><g class="camera"><rect width="1280" height="720" fill="#263e3c"/><ellipse cx="670" cy="320" rx="480" ry="350" fill="url(#warmPool)" opacity=".25"/><path d="M0 480q210-40 440 0t420-10 420 5v245H0z" fill="#514c3b"/><ellipse cx="650" cy="603" rx="390" ry="30" fill="#14231e" opacity=".4"/><g id="journal"><rect x="340" y="170" width="600" height="410" rx="20" fill="#896c4e"/><path d="M375 202q130-23 265 21 134-44 265-21v333q-134-22-265 20-135-42-265-20z" fill="url(#paper)" stroke="#c7b18c" stroke-width="4"/><path d="M640 223v332" stroke="#ad997a" stroke-width="4"/><text x="410" y="270" fill="#665b49" font-size="22" letter-spacing="3" font-family="sans-serif">FIELD NOTES</text><path d="M410 310h180m-180 35h160m-160 35h175m-175 35h125" stroke="#a7987f" stroke-width="3" opacity=".65"/><path id="route" d="M700 450Q730 340 800 365t70-85" fill="none" stroke="#7d876c" stroke-width="5" stroke-linecap="round" stroke-dasharray="1" pathLength="1"/><circle cx="870" cy="280" r="9" fill="#ab7557"/></g></g><text x="65" y="72" fill="#f9ecd4" font-size="24" font-family="sans-serif" letter-spacing="3">A CLOSER LOOK</text></g></svg><script>
const NS='http://www.w3.org/2000/svg', $=id=>document.getElementById(id), clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), ease=x=>{x=clamp(x);return x*x*(3-2*x)}, lerp=(a,b,t)=>a+(b-a)*t, DURATION=10;window.DURATION=DURATION;
// Long-bodied, restrained side-view character structure, drawn from the supplied character-reference observations.
function actor(parent,role='soldier',scale=1){
 let g=document.createElementNS(NS,'g'), cloth=role==='civilian'?'#e4dfd6':'#a7aa7a', shade=role==='civilian'?'#bebdc2':'#747d5d';
 g.innerHTML=`<ellipse class="shadow" cx="0" cy="-2" rx="24" ry="4.5" fill="#0b1512" opacity=".28"/>
 <g class="farLeg"><path class="bone" fill="none" stroke="#222825" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><g class="boot"><path d="M-4-5h10q7 0 10 5H-5z" fill="#282722"/></g></g>

 <g class="upper">
  <g class="backArm"><path class="bone" fill="none" stroke="#151c1b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path class="sleeveShadow" fill="none" stroke="${shade}" stroke-opacity=".36" stroke-width="20" stroke-linecap="round"/><path class="sleeve" fill="none" stroke="${cloth}" stroke-width="17" stroke-linecap="round"/><g class="hand"><circle r="6" fill="#111716"/></g></g>
  <path class="torso" d="M-30-277q0-21 28-21h4q28 0 28 21v101q0 22-21 22h-19q-20 0-20-22z" fill="${cloth}"/>
  <path d="M-30-274q0-21 25-23-12 8-12 25v98q0 13 9 19h-2q-20 0-20-21z" fill="${shade}" opacity=".38"/>
  <path d="M18-283q10 5 10 19v85q0 12-5 17" stroke="#eee8cb" stroke-opacity=".27" stroke-width="5" stroke-linecap="round" fill="none"/>
 <g class="nearLeg"><path class="bone" fill="none" stroke="#101715" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><g class="boot"><path d="M-4-5h10q7 0 10 5H-5z" fill="#101715"/><path d="M-3 0h17" stroke="#8b7e67" stroke-opacity=".45" stroke-width="1"/></g></g>

  <g class="frontArm"><path class="bone" fill="none" stroke="#0f1817" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path class="sleeveShadow" fill="none" stroke="${shade}" stroke-opacity=".36" stroke-width="20" stroke-linecap="round"/><path class="sleeve" fill="none" stroke="${cloth}" stroke-width="17" stroke-linecap="round"/><g class="hand"><circle r="6" fill="#101716"/><g class="bag" opacity="0" transform="translate(-4,4)"><path d="M-9 3q0-5 5-5h19q5 0 5 5v23H-9z" fill="#6c5b44" stroke="#302a21" stroke-width="2"/><path d="M0-2v-4q4-5 9 0v4" fill="none" stroke="#b4a17d" stroke-width="2"/></g><g class="letter" opacity="0" transform="translate(4,-5) rotate(-8)"><rect x="-1" y="-21" width="34" height="24" rx="1" fill="url(#paper)" stroke="#776850" stroke-width="1.2"/><path d="M-1-20l17 12 17-12" fill="none" stroke="#9a8b72" stroke-width="1.4"/></g></g></g>
  <g class="head"><circle cx="0" cy="-332" r="32" fill="url(#head)" stroke="#111416" stroke-width="1.5"/><ellipse cx="-10" cy="-348" rx="13" ry="5" fill="#c6ced0" opacity=".10"/>
   <g class="eyes"><ellipse cx="-10" cy="-334" rx="5.5" ry="7.2" fill="#f9f9ef"/><ellipse cx="10" cy="-334" rx="5.5" ry="7.2" fill="#f9f9ef"/></g><path class="brows" d="M-16-348h11M4-348h11" stroke="#e6e8df" stroke-width="2" stroke-linecap="round" fill="none"/><path class="mouth" d="M-4-318q4 3 8 0" fill="none" stroke="#e4e6df" stroke-width="2" stroke-linecap="round"/>
   ${role==='civilian'?'':`<path d="M-34-352q1-36 34-36t34 36q-34 9-68 0z" fill="url(#uniform)" stroke="#313b2d" stroke-width="2"/><path d="M-32-352q32 8 64 0" fill="none" stroke="#b2b28d" stroke-width="2"/>`}
  </g>
 </g>`;$(parent).appendChild(g);g.dataset.scale=scale;return g;
}
function limb(g,sel,phase,offset,walk,stride,bob){
 let q=g.querySelector(sel),p=((phase/(2*Math.PI)+offset)%1+1)%1, x,y;
 if(walk){if(p<.6){x=lerp(stride/2,-stride/2,p/.6);y=-4}else{let z=(p-.6)/.4;x=lerp(-stride/2,stride/2,ease(z));y=-4-4.5*Math.sin(Math.PI*z)}}else{x=offset===0?-2:2;y=-4}
 let ax=offset===0?-3:3,ay=-176-bob,kx=lerp(ax,x,.5)+(walk&&p>.6?3*Math.sin(Math.PI*(p-.6)/.4):0),ky=(ay+y)/2;
 q.querySelector('.bone').setAttribute('d',`M${ax} ${ay}L${kx} ${ky}L${x} ${y}`);q.querySelector('.boot').setAttribute('transform',`translate(${x} ${y}) rotate(${walk&&p>.6?-3*Math.sin((p-.6)/.4*Math.PI):0})`);
}
function put(g,x,y,scale,phase=0,walk=0,look=0,expression='neutral',gesture=0,stride=36,reach=0){
 let s=(scale||+g.dataset.scale)*.72;g.setAttribute('transform',`translate(${x} ${y}) scale(${s})`);let q=sel=>g.querySelector(sel),step=Math.sin(phase)*walk,bob=walk?.65*(1-Math.cos(phase*2)):.25*Math.sin(phase*.5);
 stride=Math.min(stride,13);limb(g,'.farLeg',phase,0,walk,stride,bob);limb(g,'.nearLeg',phase,.5,walk,stride,bob);q('.upper').setAttribute('transform',`translate(0 ${-bob}) rotate(${walk?step*.55:0} 0 -176)`);
 function arm(sel,sx,sy,elx,ely,hx,hy){let e=q(sel);e.querySelector('.bone').setAttribute('d',`M${sx} ${sy}L${elx} ${ely}L${hx} ${hy}`);e.querySelector('.sleeveShadow').setAttribute('d',`M${sx} ${sy}L${lerp(sx,elx,.36)} ${lerp(sy,ely,.36)}`);e.querySelector('.sleeve').setAttribute('d',`M${sx} ${sy}L${lerp(sx,elx,.36)} ${lerp(sy,ely,.36)}`);e.querySelector('.hand').setAttribute('transform',`translate(${hx} ${hy})`)}
 arm('.backArm',18,-276,25-step*1.6,-227,32-step*3,-160);
 let action=clamp(gesture)*.36,ex=lerp(-11+step*1.5,9,action),ey=lerp(-226,-233,action),hx=lerp(-7+step*3,26,action),hy=lerp(-172,reach?-217:-207,action);arm('.frontArm',-11,-276,ex,ey,hx,hy);
 q('.head').setAttribute('transform',`rotate(${look*.2+Math.sin(phase*.16)*.35} 0 -332)`);let blink=(Math.sin(phase*.24+1)>.991)?.12:(expression==='startled'?1.15:1);q('.eyes').setAttribute('transform',`translate(0 ${-334*(1-blink)}) scale(1 ${blink})`);q('.mouth').setAttribute('d',expression==='startled'?'M-3-318a3 3 0 1 0 6 0a3 3 0 1 0-6 0':expression==='worried'?'M-4-316q4-3 8 0':expression==='smile'?'M-5-318q5 4 10 0':'M-4-318q4 2 8 0');q('.brows').setAttribute('d',expression==='startled'?'M-16-352l11-1M4-353l11 1':expression==='worried'?'M-16-348l11-2M4-350l11 2':'M-16-348h11M4-348h11')
}

const a=actor('walkers','soldier',1),b=actor('walkers','civilian',.85);
function camera(id,x,y,z){$(id).querySelector('.camera').setAttribute('transform',`translate(640 360) scale(${z}) translate(${-x} ${-y})`)}
function draw(t){let isWide=t<5;for(const s of document.querySelectorAll('.scene'))s.style.display=(s.id===(isWide?'wide':'detail'))?'block':'none';if(isWide){camera('wide',630+t*8,360,1.03+t*.005);$('clouds').setAttribute('transform',`translate(${-t*8} 0)`);$('particles').setAttribute('transform',`translate(${t*4} ${-t*3})`);put(a,430+t*8,645,1,t*5,1,0,'neutral',0,13);put(b,320+t*8,645,.85,t*5+.5,1,2,'smile',0,13)}else{let u=t-5;camera('detail',640,360,1.02+u*.012);$('journal').setAttribute('transform',`rotate(${-2+Math.sin(u*.6)*.4} 640 400)`);$('route').setAttribute('stroke-dashoffset',1-ease(u/2))}}
function seek(t){t=clamp(t,0,DURATION-.001);let cross=5;if(t>=cross&&t<cross+.22){draw(cross-.001);let prev=$('wide');draw(t);prev.style.display='block';$('detail').style.opacity=ease((t-cross)/.22)}else{draw(t);$('detail').style.opacity=1}}
window.seek=seek;let params=new URLSearchParams(location.search);if(params.has('t'))seek(+params.get('t'));else{let start=performance.now();function play(now){seek(((now-start)/1000)%DURATION);requestAnimationFrame(play)}requestAnimationFrame(play)}
</script></body></html>
