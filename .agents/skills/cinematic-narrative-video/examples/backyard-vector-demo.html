<script>
/* Deterministic, side-effect-free timeline: browser preview and offline renderer call the same seek(t). */
(() => {
  const DURATION = 18, svg = document.querySelector('svg');
  const byId = id => document.getElementById(id);
  const clamp = (x,a,b) => Math.min(b,Math.max(a,x));
  const ease = x => { x=clamp(x,0,1); return x*x*(3-2*x); };
  const fade = (t,start,end) => ease((t-start)/(end-start));
  function pose(t, walking, gesture) {
    const cycle = Math.sin(t * 7.1), swing = walking * cycle * 18;
    byId('leg-front').setAttribute('transform', `rotate(${swing} 8 -105)`);
    byId('leg-back').setAttribute('transform', `rotate(${-swing} -8 -105)`);
    byId('arm-front').setAttribute('transform', `rotate(${-46*gesture - swing*.7*(1-gesture)} 23 -143)`);
    byId('arm-back').setAttribute('transform', `rotate(${swing*.6} -23 -143)`);
    byId('head').setAttribute('transform', `rotate(${-5*gesture} 0 -177)`);
    const blink=Math.abs(t-4.2)<.08 ? .14 : 1;
    byId('eyes').setAttribute('transform', `translate(0 -180) scale(1 ${blink}) translate(0 180)`);
    byId('mouth').setAttribute('d',gesture > .5 ? 'M-5 -163 Q0 -168 5 -163' : 'M-5 -164 Q0 -160 5 -164');
  }
  function seek(seconds) {
    const t=clamp(Number(seconds)||0,0,DURATION), yard=t<6.4, board=t>=6.4 && t<12.8;
    byId('yard-scene').setAttribute('visibility',yard?'visible':'hidden');
    byId('diagram-scene').setAttribute('visibility',board?'visible':'hidden');
    byId('end-scene').setAttribute('visibility',!yard&&!board?'visible':'hidden');
    if (yard) {
      const walking=t<2.0, x=100 + 210*ease(t/2.0), bounce=walking ? Math.abs(Math.sin(t*7.1))*3 : 0;
      byId('hero-yard').setAttribute('transform',`translate(${x} ${570-bounce})`);
      pose(t,walking?1:0,fade(t,3.5,4.2));
      const rise=fade(t,2.2,3.4);byId('oil').setAttribute('opacity',rise);
      byId('fountain').setAttribute('transform',`translate(0 ${170*(1-rise)}) scale(1 ${Math.max(.02,rise)})`);
      byId('yard-copy').setAttribute('opacity',1-fade(t,4.8,6.1));
    } else if (board) {
      const u=t-6.4; pose(u,0,fade(u,1.0,1.6)*(1-fade(u,5.0,5.5)));
      byId('reservoir').setAttribute('opacity',fade(u,.5,1.3));
      byId('diagram-label-a').setAttribute('opacity',fade(u,1.3,1.8));
      const path=byId('pathway');path.setAttribute('opacity',fade(u,2.6,3));path.setAttribute('stroke-dashoffset',String(-u*18));
      byId('diagram-label-b').setAttribute('opacity',fade(u,3.5,4));
    } else {
      const u=t-12.8;pose(u,0,fade(u,.6,1.2));byId('end-card').setAttribute('opacity',fade(u,.2,.9));
    }
    svg.dataset.time=t.toFixed(3); return t;
  }
  window.seek=seek;window.DURATION=DURATION;
  const query=new URLSearchParams(location.search);
  if(query.has('t')) { seek(Number(query.get('t'))); return; }
  const start=performance.now();
  function tick(now){seek(((now-start)/1000)%DURATION);requestAnimationFrame(tick);}requestAnimationFrame(tick);
})();
</script>
