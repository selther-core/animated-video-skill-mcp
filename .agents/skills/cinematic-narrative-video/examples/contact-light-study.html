/* Original reusable 2D motion helpers. Coordinates must use one consistent space. */
(function (root) {
  'use strict';
  function solveTwoBone(start, desired, l1, l2, bend = 1) {
    const finite = p => Array.isArray(p) && p.length === 2 && p.every(Number.isFinite);
    if (!finite(start) || !finite(desired) || !Number.isFinite(l1) || !Number.isFinite(l2) || l1 <= 0 || l2 <= 0 || ![1,-1].includes(bend)) throw Error('Invalid two-bone inputs');
    let dx=desired[0]-start[0], dy=desired[1]-start[1], d=Math.hypot(dx,dy);
    const min=Math.abs(l1-l2), max=l1+l2, reachable=d>=min-1e-9 && d<=max+1e-9;
    const ux=d>1e-9?dx/d:1, uy=d>1e-9?dy/d:0;
    const safe=Math.max(1e-9,Math.min(max,Math.max(min,d)));
    const a=(l1*l1-l2*l2+safe*safe)/(2*safe), h=Math.sqrt(Math.max(0,l1*l1-a*a));
    const joint=[start[0]+a*ux-bend*h*uy,start[1]+a*uy+bend*h*ux];
    const end=[start[0]+safe*ux,start[1]+safe*uy];
    return {joint,end,reachable,error:Math.hypot(end[0]-desired[0],end[1]-desired[1])};
  }
  function apply(m,p){ return [m[0]*p[0]+m[2]*p[1]+m[4],m[1]*p[0]+m[3]*p[1]+m[5]]; }
  function inverse(m){ const [a,b,c,d,e,f]=m, det=a*d-b*c; if (!Number.isFinite(det)||Math.abs(det)<1e-12) throw Error('Singular transform'); return [d/det,-b/det,-c/det,a/det,(c*f-d*e)/det,(b*e-a*f)/det]; }
  function multiply(m,n){ const [a,b,c,d,e,f]=m,[g,h,i,j,k,l]=n;return [a*g+c*h,b*g+d*h,a*i+c*j,b*i+d*j,a*k+c*l+e,b*k+d*l+f]; }
  const api={solveTwoBone,apply,inverse,multiply};
  if(typeof module!=='undefined' && module.exports) module.exports=api;
  root.MotionMath=api;
})(typeof globalThis!=='undefined'?globalThis:this);

const NS='http://www.w3.org/2000/svg',$=id=>document.getElementById(id),DURATION=9.2;window.DURATION=DURATION;
const clamp=x=>Math.max(0,Math.min(1,x)),ease=x=>{x=clamp(x);return x*x*(3-2*x)},lerp=(a,b,q)=>a+(b-a)*q;
function state(t){const approach=ease((t-.75)/1.45),retreat=ease((t-3.35)/1.25),touch=approach*(1-retreat),root=[478,378],target=[lerp(470,650,touch),lerp(493,460,touch)],arm=MotionMath.solveTwoBone(root,target,115,95,-1);return {root,target,arm,touch,lit:ease((t-2.25)/.65),growth:ease((t-3.05)/2.4)}}
function seek(t){t=Math.max(0,Math.min(DURATION-.001,t));let a=state(t),focus=ease((t-3)/1.8)*(1-ease((t-6.6)/1.6)),z=1+.22*focus,cx=640+100*focus,cy=360+52*focus;
 $('camera').setAttribute('transform',`translate(640 360) scale(${z}) translate(${-cx} ${-cy})`);
 $('frontArm').setAttribute('d',`M${a.root} L${a.arm.joint} L${a.arm.end}`);$('sleeve').setAttribute('d',`M${a.root} L${lerp(a.root[0],a.arm.joint[0],.55)} ${lerp(a.root[1],a.arm.joint[1],.55)}`);$('hand').setAttribute('cx',a.arm.end[0]);$('hand').setAttribute('cy',a.arm.end[1]);
 $('roomGlow').setAttribute('opacity',.18+.65*a.lit);$('roomBeam').setAttribute('opacity',.03+.14*a.lit);$('button').setAttribute('fill',a.lit>.5?'#72d5ad':'#a45648');$('stem').setAttribute('stroke-dashoffset',1-a.growth);$('leaves').setAttribute('opacity',ease((t-4.1)/1.1));
 $('head').setAttribute('transform',`translate(0 ${1.2*Math.sin(t*1.4)}) rotate(${1.4*Math.sin(t*.9)} 455 302)`);$('mouth').setAttribute('d',t>5?'M448 319q7 7 14 0':'M449 321q6-2 12 0');$('brows').setAttribute('d',t>5?'M434 283l12 2M464 285l12-2':'M434 285l12-2M464 283l12 2');let blink=(Math.sin(t*2.2)>.994)? .12:1;$('eyes').setAttribute('transform',`translate(0 ${300*(1-blink)}) scale(1 ${blink})`);$('weather').setAttribute('transform',`translate(${-((t*18)%44)} ${(t*34)%90})`);return a}
window.seek=seek;window.motionSamples=t=>{seek(t);let camera=$('camera').getCTM(), inv=camera.inverse();function point(el,x,y){let p=new DOMPoint(x,y).matrixTransform(el.getCTM()).matrixTransform(inv);return [p.x,p.y]}let arm=$('frontArm'), values=arm.getAttribute('d').match(/[-+]?(?:\d*\.)?\d+(?:e[-+]?\d+)?/gi).map(Number), joints=[point(arm,values[0],values[1]),point(arm,values[2],values[3]),point(arm,values[4],values[5])];let samples={time:t,limbs:[{id:'front-arm',joints,rest_lengths:[115,95],relative_tolerance:.001}]};if(t>=2.2&&t<=3.35)samples.contacts=[{id:'switch-press-1',point:point($('hand'),+$('hand').getAttribute('cx'),+$('hand').getAttribute('cy')),target:point($('button'),650,460),tolerance:.01,fixed_target:true}];return samples};
const q=new URLSearchParams(location.search);if(q.has('t'))seek(+q.get('t'));else{let start=performance.now();function tick(now){seek(((now-start)/1000)%DURATION);requestAnimationFrame(tick)}requestAnimationFrame(tick)}
